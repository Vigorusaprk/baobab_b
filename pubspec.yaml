name: baobab_business
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  clean_structure: ^0.2.2
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  go_router: ^17.1.0
  intl: ^0.20.2
  fl_chart: ^1.2.0 # pour les graphiques
  dartz: ^0.10.1   # pour la gestion Either (optionnel)
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.2
  bloc: ^9.2.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.4
  flutter_staggered_animations: ^1.1.1
  dio: ^5.9.2
  json_annotation: ^4.11.0
  jwt_decoder: ^2.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images
    - assets/app_icon
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/Poppins/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/Poppins/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/Poppins/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/Poppins/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/Poppins/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/Poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/Poppins/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/Poppins/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/roboto/Roboto-Regular.ttf
        - asset: assets/roboto/Roboto-Bold.ttf
          weight: 700


flutter_native_splash:
  color: "#3E7044" # couleur de fond
  image: assets/Sans_titre-2.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#3E7044"
    image: assets/Sans_titre-2.png

